[build]
  base = ""
  publish = "Spacyfy"
  command = ""

# Always fetch the latest service worker so app updates reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
